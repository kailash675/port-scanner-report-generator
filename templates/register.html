<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SecureScan - Create Account</title>

    <style>

        /* =====================================================
           RESET
           ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           BODY
           ===================================================== */

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                Arial,
                sans-serif;

            color: #e2e8f0;

            overflow-y: auto;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(37, 99, 235, 0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(14, 165, 233, 0.16),
                    transparent 30%
                ),

                #050b14;
        }


        /* =====================================================
           CYBER GRID
           ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: 0.17;

            background-image:
                linear-gradient(
                    rgba(56, 189, 248, 0.08) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(56, 189, 248, 0.08) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            animation:
                gridMove 18s linear infinite;
        }


        @keyframes gridMove {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(45px, 45px);
            }
        }


        /* =====================================================
           GLOW ORBS
           ===================================================== */

        .orb {

            position: fixed;

            width: 260px;
            height: 260px;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.20;

            pointer-events: none;
        }


        .orb-one {

            top: -100px;
            left: -80px;

            background: #2563eb;

            animation:
                floatOne 7s ease-in-out infinite;
        }


        .orb-two {

            right: -100px;
            bottom: -100px;

            background: #06b6d4;

            animation:
                floatTwo 9s ease-in-out infinite;
        }


        @keyframes floatOne {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(50px, 35px);
            }
        }


        @keyframes floatTwo {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-45px, -30px);
            }
        }


        /* =====================================================
           WRAPPER
           ===================================================== */

        .auth-wrapper {

            position: relative;

            width: 100%;

            max-width: 480px;

            padding: 22px;

            z-index: 2;

            animation:
                pageEnter 0.7s ease-out;
        }


        @keyframes pageEnter {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           REGISTER CARD
           ===================================================== */

        .register-card {

            position: relative;

            padding: 38px 40px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 28, 48, 0.95),
                    rgba(7, 17, 31, 0.95)
                );

            border:
                1px solid
                rgba(96, 165, 250, 0.18);

            box-shadow:

                0 30px 80px
                rgba(0, 0, 0, 0.55),

                0 0 45px
                rgba(37, 99, 235, 0.08);

            backdrop-filter:
                blur(20px);

            overflow: hidden;

            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
        }


        .register-card:hover {

            transform: translateY(-4px);

            border-color:
                rgba(56, 189, 248, 0.35);

            box-shadow:

                0 35px 90px
                rgba(0, 0, 0, 0.6),

                0 0 55px
                rgba(37, 99, 235, 0.14);
        }


        /* Animated top line */

        .register-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: -30%;

            width: 160%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #2563eb,
                    #38bdf8,
                    transparent
                );

            animation:
                topGlow 4s linear infinite;
        }


        @keyframes topGlow {

            from {
                transform: translateX(-35%);
            }

            to {
                transform: translateX(35%);
            }
        }


        /* =====================================================
           BRAND
           ===================================================== */

        .brand {

            text-align: center;

            margin-bottom: 27px;
        }


        .brand-icon {

            width: 68px;
            height: 68px;

            margin:
                0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 19px;

            font-size: 32px;

            background:
                linear-gradient(
                    135deg,
                    #123c70,
                    #0b1d36
                );

            border:
                1px solid
                rgba(96, 165, 250, 0.25);

            box-shadow:
                0 0 30px
                rgba(37, 99, 235, 0.18);

            animation:
                shieldFloat 3s ease-in-out infinite;
        }


        @keyframes shieldFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }


        .brand h1 {

            font-size: 27px;

            letter-spacing: 1px;

            background:
                linear-gradient(
                    90deg,
                    #f8fafc,
                    #93c5fd,
                    #38bdf8
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color:
                transparent;
        }


        .brand p {

            margin-top: 7px;

            color: #64748b;

            font-size: 12px;
        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-group {

            margin-bottom: 17px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #cbd5e1;

            font-size: 12px;

            font-weight: 600;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #64748b;

            font-size: 16px;

            pointer-events: none;

            transition:
                color 0.25s ease;
        }


        input {

            width: 100%;

            height: 48px;

            padding:
                0 46px;

            border-radius: 11px;

            border:
                1px solid #24344a;

            outline: none;

            background:
                rgba(5, 13, 25, 0.8);

            color: #f8fafc;

            font-size: 13px;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease,
                background 0.25s ease;
        }


        input::placeholder {

            color: #475569;
        }


        input:focus {

            border-color: #38bdf8;

            background:
                rgba(7, 18, 33, 0.95);

            transform:
                translateY(-1px);

            box-shadow:

                0 0 0 3px
                rgba(56, 189, 248, 0.08),

                0 8px 25px
                rgba(0, 0, 0, 0.2);
        }


        .input-wrapper:focus-within
        .input-icon {

            color: #38bdf8;
        }


        /* =====================================================
           PASSWORD TOGGLE
           ===================================================== */

        .password-toggle {

            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            width: auto;

            height: auto;

            padding: 5px;

            border: none;

            background:
                transparent;

            color: #64748b;

            font-size: 16px;

            cursor: pointer;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }


        .password-toggle:hover {

            color: #38bdf8;

            transform:
                translateY(-50%)
                scale(1.1);
        }


        /* =====================================================
           PASSWORD STRENGTH
           ===================================================== */

        .strength-container {

            margin-top: 8px;
        }


        .strength-bar {

            width: 100%;

            height: 4px;

            border-radius: 10px;

            background: #172235;

            overflow: hidden;
        }


        .strength-fill {

            width: 0%;

            height: 100%;

            border-radius: 10px;

            transition:
                width 0.3s ease,
                background 0.3s ease;
        }


        .strength-text {

            margin-top: 5px;

            font-size: 10px;

            color: #64748b;

            transition:
                color 0.25s ease;
        }


        /* =====================================================
           PASSWORD MATCH
           ===================================================== */

        .match-text {

            min-height: 15px;

            margin-top: 5px;

            font-size: 10px;
        }


        .match-success {

            color: #4ade80;
        }


        .match-error {

            color: #f87171;
        }


        /* =====================================================
           REGISTER BUTTON
           ===================================================== */

        #registerButton {

            position: relative;

            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0ea5e9
                );

            color: white;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 0.5px;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                0 8px 25px
                rgba(37, 99, 235, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }


        #registerButton::before {

            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.22),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                left 0.6s ease;
        }


        #registerButton:hover {

            transform:
                translateY(-2px);

            filter:
                brightness(1.08);

            box-shadow:
                0 12px 35px
                rgba(37, 99, 235, 0.4);
        }


        #registerButton:hover::before {

            left: 130%;
        }


        #registerButton:active {

            transform:
                translateY(0);
        }


        #registerButton:disabled {

            cursor:
                not-allowed;

            opacity: 0.75;
        }


        /* =====================================================
           LOADING SPINNER
           ===================================================== */

        .spinner {

            display: inline-block;

            width: 16px;
            height: 16px;

            border:
                2px solid
                rgba(255,255,255,0.35);

            border-top-color:
                white;

            border-radius: 50%;

            animation:
                spin 0.7s linear infinite;

            vertical-align: middle;

            margin-right: 8px;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        #message {

            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            font-size: 12px;

            font-weight: 600;
        }


        .message-error {

            color: #f87171;

            animation:
                shake 0.4s ease;
        }


        .message-success {

            color: #4ade80;

            animation:
                successPop 0.45s ease;
        }


        @keyframes shake {

            0%,
            100% {
                transform:
                    translateX(0);
            }

            25% {
                transform:
                    translateX(-6px);
            }

            75% {
                transform:
                    translateX(6px);
            }
        }


        @keyframes successPop {

            from {
                opacity: 0;

                transform:
                    scale(0.9);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }


        /* =====================================================
           LOGIN LINK
           ===================================================== */

        .login-text {

            margin-top: 20px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(148, 163, 184, 0.10);

            text-align: center;

            color: #64748b;

            font-size: 12px;
        }


        .login-text a {

            color: #38bdf8;

            text-decoration: none;

            font-weight: 700;

            transition:
                color 0.2s ease;
        }


        .login-text a:hover {

            color: #7dd3fc;

            text-decoration:
                underline;
        }


        /* =====================================================
           SECURITY NOTE
           ===================================================== */

        .security-note {

            margin-top: 18px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            color: #475569;

            font-size: 10px;
        }


        .security-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px
                rgba(34, 197, 94, 0.6);

            animation:
                securityPulse 2s infinite;
        }


        @keyframes securityPulse {

            0%,
            100% {
                box-shadow:
                    0 0 4px
                    rgba(34, 197, 94, 0.3);
            }

            50% {
                box-shadow:
                    0 0 14px
                    rgba(34, 197, 94, 0.7);
            }
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 500px) {

            body {
                align-items: flex-start;

                padding-top: 20px;
            }

            .auth-wrapper {
                padding: 15px;
            }

            .register-card {

                padding:
                    30px 23px;

                border-radius:
                    18px;
            }

            .brand h1 {
                font-size: 24px;
            }

            .brand-icon {

                width: 62px;
                height: 62px;

                font-size: 29px;
            }
        }


        /* =====================================================
           REDUCED MOTION
           ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }

    </style>

</head>


<body>


    <!-- Background effects -->

    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>


    <div class="auth-wrapper">


        <div class="register-card">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    🛡️
                </div>

                <h1>
                    SECURESCAN
                </h1>

                <p>
                    Create your security account
                </p>

            </div>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Choose a username"
                            minlength="3"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            📧
                        </span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a strong password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>


                    <div class="strength-container">

                        <div class="strength-bar">

                            <div
                                class="strength-fill"
                                id="strengthFill"
                            ></div>

                        </div>

                        <div
                            class="strength-text"
                            id="strengthText"
                        >
                            Password strength
                        </div>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔐
                        </span>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="confirmToggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                    <div
                        class="match-text"
                        id="matchText"
                    ></div>

                </div>


                <!-- REGISTER -->

                <button
                    type="submit"
                    id="registerButton"
                >
                    Create Account
                </button>


            </form>


            <!-- MESSAGE -->

            <div id="message"></div>


            <!-- LOGIN -->

            <p class="login-text">

                Already have an account?

                <a href="/login-page">
                    Login
                </a>

            </p>


            <!-- SECURITY -->

            <div class="security-note">

                <span class="security-dot"></span>

                Secure registration enabled

            </div>


        </div>

    </div>


    <script>

        /* =====================================================
           PASSWORD TOGGLE
           ===================================================== */

        function setupPasswordToggle(
            inputId,
            buttonId
        ) {

            const input =
                document.getElementById(
                    inputId
                );

            const button =
                document.getElementById(
                    buttonId
                );


            button.addEventListener(
                "click",
                function() {

                    if (
                        input.type ===
                        "password"
                    ) {

                        input.type =
                            "text";

                        button.innerText =
                            "🙈";

                    }

                    else {

                        input.type =
                            "password";

                        button.innerText =
                            "👁";

                    }

                }
            );

        }


        setupPasswordToggle(
            "password",
            "passwordToggle"
        );


        setupPasswordToggle(
            "confirmPassword",
            "confirmToggle"
        );


        /* =====================================================
           PASSWORD STRENGTH
           ===================================================== */

        const password =
            document.getElementById(
                "password"
            );

        const strengthFill =
            document.getElementById(
                "strengthFill"
            );

        const strengthText =
            document.getElementById(
                "strengthText"
            );


        password.addEventListener(
            "input",
            function() {

                const value =
                    password.value;


                let score = 0;


                if (value.length >= 6) {
                    score++;
                }

                if (value.length >= 10) {
                    score++;
                }

                if (/[A-Z]/.test(value)) {
                    score++;
                }

                if (/[0-9]/.test(value)) {
                    score++;
                }

                if (
                    /[^A-Za-z0-9]/.test(value)
                ) {
                    score++;
                }


                const percentage =
                    score * 20;


                strengthFill.style.width =
                    percentage + "%";


                if (!value) {

                    strengthText.innerText =
                        "Password strength";

                    strengthText.style.color =
                        "#64748b";
                }

                else if (score <= 2) {

                    strengthText.innerText =
                        "Weak password";

                    strengthText.style.color =
                        "#f87171";
                }

                else if (score <= 3) {

                    strengthText.innerText =
                        "Medium password";

                    strengthText.style.color =
                        "#fbbf24";
                }

                else if (score === 4) {

                    strengthText.innerText =
                        "Strong password";

                    strengthText.style.color =
                        "#4ade80";
                }

                else {

                    strengthText.innerText =
                        "Very strong password";

                    strengthText.style.color =
                        "#22d3ee";
                }


                if (score <= 2) {

                    strengthFill.style.background =
                        "#ef4444";
                }

                else if (score <= 3) {

                    strengthFill.style.background =
                        "#f59e0b";
                }

                else {

                    strengthFill.style.background =
                        "#22c55e";
                }


                checkPasswordMatch();

            }
        );


        /* =====================================================
           PASSWORD MATCH
           ===================================================== */

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );

        const matchText =
            document.getElementById(
                "matchText"
            );


        function checkPasswordMatch() {

            const pass =
                password.value;

            const confirm =
                confirmPassword.value;


            if (!confirm) {

                matchText.innerText =
                    "";

                matchText.className =
                    "match-text";

                return;
            }


            if (pass === confirm) {

                matchText.innerText =
                    "✓ Passwords match";

                matchText.className =
                    "match-text match-success";
            }

            else {

                matchText.innerText =
                    "✕ Passwords do not match";

                matchText.className =
                    "match-text match-error";
            }

        }


        confirmPassword.addEventListener(
            "input",
            checkPasswordMatch
        );


        /* =====================================================
           REGISTER
           ===================================================== */

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById(
                                "username"
                            )
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById(
                                "email"
                            )
                            .value
                            .trim();


                    const pass =
                        password.value;


                    const confirm =
                        confirmPassword.value;


                    const message =
                        document.getElementById(
                            "message"
                        );


                    const registerButton =
                        document.getElementById(
                            "registerButton"
                        );


                    /* Reset message */

                    message.className = "";

                    message.innerText = "";


                    /* Validate username */

                    if (username.length < 3) {

                        message.className =
                            "message-error";

                        message.innerText =
                            "Username must contain at least 3 characters.";

                        return;
                    }


                    /* Validate email */

                    const emailPattern =
                        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                    if (
                        !emailPattern.test(email)
                    ) {

                        message.className =
                            "message-error";

                        message.innerText =
                            "Please enter a valid email address.";

                        return;
                    }


                    /* Validate password */

                    if (pass.length < 6) {

                        message.className =
                            "message-error";

                        message.innerText =
                            "Password must contain at least 6 characters.";

                        return;
                    }


                    /* Confirm password */

                    if (pass !== confirm) {

                        message.className =
                            "message-error";

                        message.innerText =
                            "Passwords do not match.";

                        return;
                    }


                    /* Loading */

                    registerButton.disabled =
                        true;

                    registerButton.innerHTML =
                        '<span class="spinner"></span>Creating Account...';


                    try {

                        const response =
                            await fetch(
                                "/register",
                                {

                                    method:
                                        "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({

                                            username:
                                                username,

                                            email:
                                                email,

                                            password:
                                                pass

                                        })

                                }
                            );


                        const data =
                            await response.json();


                        /* =========================
                           ERROR
                           ========================= */

                        if (!response.ok) {

                            message.className =
                                "message-error";

                            message.innerText =
                                data.error ||
                                "Registration failed.";

                            registerButton.disabled =
                                false;

                            registerButton.innerText =
                                "Create Account";

                            return;
                        }


                        /* =========================
                           SUCCESS
                           ========================= */

                        message.className =
                            "message-success";

                        message.innerText =
                            "✓ Account created successfully!";


                        registerButton.innerText =
                            "✓ Account Created";


                        setTimeout(
                            function() {

                                window.location.href =
                                    "/login-page";

                            },
                            1000
                        );

                    }


                    catch (error) {

                        console.error(error);


                        message.className =
                            "message-error";

                        message.innerText =
                            "Unable to connect to server.";


                        registerButton.disabled =
                            false;

                        registerButton.innerText =
                            "Create Account";
                    }

                }
            );

    </script>

</body>

</html>
